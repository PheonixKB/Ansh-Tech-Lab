version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    reviewers:
      - "harshp2035"
      - "Jay04Makwana"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps): "

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "first_monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    reviewers:
      - "harshp2035"
      - "Jay04Makwana"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps): "
